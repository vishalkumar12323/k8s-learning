apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: service-discovery-demo
  labels:
    app.kubernetes.io/name: backend-ingress
spec:
  rules:
  - host: backend.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: backend-service
            port: 
              number: 80
