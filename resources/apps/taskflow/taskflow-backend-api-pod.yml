apiVersion: v1
kind: Pod
metadata:
  name: taskflow-backend
  namespace: taskflow-app
  labels:
    app.kubernetes.io/name: taskflow-backend
spec:
  containers:
  - name: taskflow-backend
    image: vishaldoc502/taskflow-backend
    resources:
      requests:
        memory: "150Mi"
        cpu: "200m"
      limits:
        memory: "200Mi"
    ports:
      - containerPort: 3001
