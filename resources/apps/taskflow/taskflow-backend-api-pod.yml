apiVersion: v1
kind: Pod
metadata:
  name: taskflow-backend
  namespace: taskflow-app
  labels:
    app.kubernetes.io/name: taskflow-backend
spec:
  containers:
  - name: taskflow-backend
    image: vishaldoc502/taskflow-backend
    resources:
      requests:
        memory: "150Mi"
        cpu: "200m"
      limits:
        memory: "200Mi"
    ports:
      - containerPort: 3001
    env:
      - name: DATABASE_URL
        value: "postgresql://postgres:postgres@localhost:5432/taskdb"
      - name: JWT_SECRET
        value: "cd20daafb0cc8ae13c78d01c73cf99665d28d18d6bcdd6f12b12c9c7e8a8a1f935d250410fba6b58e1d626d22e91a6d16b40793bf33cfcf9203626028c641f73"
      - name: JWT_EXPIRES_IN
        value: "7d"
      - name: PORT 
        value: "3001"
      - name: NODE_ENV
        value: "production"

  - name: taskflow-database
    image: postgres:16-alpine
    resources:
      requests:
        memory: "250Mi"
        cpu: "200m"
      limits:
        memory: "500Mi"
    ports: 
      - containerPort: 5432
    

