apiVersion: v1
kind: Pod
metadata:
  name: taskflow-frontend
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/component: frontend 
    app.kubernetes.io/instance: taskflow-frontend
spec:
  containers:
  - name: taskflow-frontend
    image: vishaldoc502/taskflow-frontend
    resources:
      requests:
        cpu: "150m"
        memory: "150Mi"
      limits:
        memory: "300Mi"
    ports:
      - containerPort: 80
