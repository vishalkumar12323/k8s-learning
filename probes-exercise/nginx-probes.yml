apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-probes
  namespace: config-demo 

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-probes
    
  template:
    metadata:
      labels:
        app: nginx-probes
    
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3
