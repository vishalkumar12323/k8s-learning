apiVersion: apps/v1
kind: Deployment 

metadata:
  name: nginx-deployment
  namespace: default

spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-pod
      app.kubernetes.io/component: webserver
      app.kubernetes.io/instance: nginx-pod
  
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-pod
        app.kubernetes.io/component: webserver
        app.kubernetes.io/instance: nginx-pod
    spec:
      containers:
        - name: nginx-webserver
          image: nginx:stable
          resources:
            requests:
              memory: "50Mi"
              cpu: "100m"
            limits:
              memory: "50Mi"
          ports:
            - containerPort: 80