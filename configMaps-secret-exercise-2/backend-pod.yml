apiVersion: v1
kind: Pod

metadata:
  name: backend-demo
  namespace: config-demo

spec:
  containers:
    - name: backend
      image: busybox:1.36

      command: ['/bin/sh', '-c', 'sleep 3600']

      envFrom:
        - configMapRef:
            name: backend-config
      
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret 
              key: DB_USER
        
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD